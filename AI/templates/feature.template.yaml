id: <feature-slug>
code_name: <PascalCaseName>
platforms:
  - editor
created: YYYY-MM-DD
owner: team
# Commit this feature started from (`git rev-parse HEAD` at --new time).
# G3/G5 diff scope is `git diff <base_ref>..HEAD -- <paths>` — NEVER a branch comparison
# like `main...HEAD` (main can be arbitrarily far behind). If missing on an older
# feature, fall back to `git diff HEAD -- <paths>` (working tree only) and say so.
base_ref: <git-sha>
# Set to `high` at Gate G0 (see build-feature.md) for payments/IAP, save-data/migrations,
# auth, or any change with wide blast radius across shared systems. Drives Gate G3 into
# panel mode (3 independent cold reviewers + consensus) instead of a single cold pass.
risk: standard
